name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:e2e:structure
      - run: npx playwright install --with-deps chromium webkit
      # E2E builds and starts Next.js with the isolated test environment.
      - run: npm run test:e2e
